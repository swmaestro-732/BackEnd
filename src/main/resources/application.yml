spring:
  application:
    name: Backend
  # DataSource: 환경변수가 있으면(CI/운영) 그 값을, 없으면 로컬 기본값(docker-compose).
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chilsami}
    username: ${SPRING_DATASOURCE_USERNAME:chilsami}
    password: ${SPRING_DATASOURCE_PASSWORD:localdev}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    # V1~V15 를 단일 V1__init.sql 로 합쳤다(현재 스키마 정본). fresh DB(로컬·CI·신규)는 이 V1 하나로 전체 스키마를 만든다.
    # baseline-on-migrate 는 켜지 않는다: 기존 스키마가 있는(비어있지 않은) DB 를 자동 baseline 하면 V1 을
    # 실행 안 함으로만 표시할 뿐, 이미 V1~V15 이력을 가진 기존 prod/dev DB 에는 애초에 적용되지 않는다.
    # 기존 prod/dev DB 는 배포 전 flyway_schema_history 를 version=1 BASELINE 행으로 교체해 V1 을 스킵한다(런북 참고).

# Actuator: health + prometheus 메트릭 노출. (스크레이프 소스는 SG로 모니터링 호스트만 허용)
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  # 분산 트레이싱(OTLP → Tempo). 기본 비활성 — 앱 EC2가 모니터링 호스트를 찾으면
  # MANAGEMENT_TRACING_EXPORT_ENABLED=true + MANAGEMENT_OTLP_TRACING_ENDPOINT env 로 활성화(fail-soft).
  # Spring Boot 4: export/propagation 토글은 management.tracing.export.enabled(management.tracing.enabled 는 4.0 deprecated),
  # OTLP endpoint 는 management.opentelemetry.tracing.export.otlp.* 로 이동.
  tracing:
    export:
      enabled: false
    sampling:
      probability: 0.1
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:}

jwt:
  # 서명 시크릿은 반드시 env(JWT_SECRET, 32바이트+)로 주입한다. 코드에 사용 가능한 기본값을 두지 않는다(fail-fast).
  secret: ${JWT_SECRET:}
  access-ttl: PT30M
  refresh-ttl: P14D
  registration-ttl: PT10M

oauth:
  kakao:
    # 로그인(OIDC)용 카카오 앱 client_id(REST API 키). 로컬(지도) 검색 키(kakao.local.rest-key)와 별개 앱/키.
    client-id: ${KAKAO_CLIENT_ID:}
    # 안드로이드/iOS SDK 로그인 id_token 의 aud = 네이티브 앱 키. 미설정 시 웹(REST 키)만 허용.
    native-app-key: ${KAKAO_NATIVE_APP_KEY:}
    jwks-uri: https://kauth.kakao.com/.well-known/jwks.json
    issuer: https://kauth.kakao.com

# 외부 지도 연동(SCRUM-387). 키가 없으면 각 기능은 빈 결과/null 로 fail-soft.
kakao:
  local:
    rest-key: ${KAKAO_REST_API_KEY:}
tmap:
  app-key: ${TMAP_APP_KEY:}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${S3_MEDIA_BUCKET:}
    cdn-base-url: ${S3_MEDIA_CDN_URL:}
    presign-ttl: PT5M
    endpoint: ${S3_ENDPOINT:}   # 비어있으면 기본 AWS, LocalStack 등은 값 설정
  sqs:
    course-count-queue-url: ${SQS_COURSE_COUNT_QUEUE_URL:}   # 비어있으면 클라이언트·폴러 비활성(로컬·CI)
    endpoint: ${SQS_ENDPOINT:}
    poll-interval-ms: 1000

# Sentry 에러 트래킹. DSN 이 비면 SDK 가 no-op(로컬/테스트 자동 비활성) — OTLP 엔드포인트와 동일한 fail-soft 관례.
# prod/dev 는 Infra 가 SENTRY_DSN·SENTRY_ENVIRONMENT 를 env 로 주입한다(app_config 시크릿 경유).
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  traces-sample-rate: 0.1   # 성능 트레이스 샘플링. 부하에 따라 조정
  send-default-pii: false
