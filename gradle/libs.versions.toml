# 버전 카탈로그 — Spring Boot BOM 밖이라 직접 핀하는 버전만 둔다(BOM 관리 라이브러리는 버전 없이 선언).
[versions]
# Gradle 플러그인(buildSrc 클래스패스)
kotlin = "2.3.21"
springBoot = "4.1.0"
springDependencyManagement = "1.1.7"
# 라이브러리
exposed = "1.3.0"
kotlinLogging = "7.0.3"
jackson2 = "2.21.4" # opensearch-java 2.25.0 이 끌어오는 jackson-databind 와 정합
awsSdk = "2.49.0"
springCloudAws = "4.0.2"
opensearch = "2.25.0"
springdoc = "3.0.3"
sentry = "8.53.0"
archunit = "1.3.0"
testcontainers = "1.20.4" # Boot BOM 이 관리하지 않는다

[libraries]
# Gradle 플러그인 아티팩트(buildSrc/build.gradle.kts 전용)
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }
spring-dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "springDependencyManagement" }
# 라이브러리
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
exposed-spring-boot-starter = { module = "org.jetbrains.exposed:exposed-spring-boot-starter", version.ref = "exposed" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlinLogging" }
jackson-module-kotlin-v2 = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson2" }
aws-bom = { module = "software.amazon.awssdk:bom", version.ref = "awsSdk" }
spring-cloud-aws-bom = { module = "io.awspring.cloud:spring-cloud-aws-dependencies", version.ref = "springCloudAws" }
opensearch-java = { module = "org.opensearch.client:opensearch-java", version.ref = "opensearch" }
springdoc-openapi-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
sentry-spring-boot = { module = "io.sentry:sentry-spring-boot-4-starter", version.ref = "sentry" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
