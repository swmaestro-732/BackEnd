name: Backend CD

# main 머지 시 이미지 빌드 → ECR push. (EC2 배포는 인프라 Phase 3 이후 추가)
on:
  push:
    branches: [main]

permissions:
  id-token: write # OIDC (AWS_DEPLOY_ROLE_ARN assume)
  contents: read

concurrency:
  group: backend-cd
  cancel-in-progress: false

jobs:
  build-push:
    name: build & push image
    runs-on: ubuntu-latest
    if: vars.AWS_DEPLOY_ROLE_ARN != '' # 배포 변수 등록 시 활성화
    steps:
      # 공급망 보안: 배포 자격증명을 다루므로 액션을 커밋 SHA로 고정 (주석은 버전)
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build & push image
        env:
          ECR: ${{ vars.ECR_REPOSITORY }}
        run: |
          TAG="${GITHUB_SHA::7}"
          docker build -t "$ECR:$TAG" -t "$ECR:latest" .
          docker push "$ECR:$TAG"
          docker push "$ECR:latest"
          {
            echo "## Backend CD — 이미지 push ✅"
            echo ""
            echo "- 레포: \`$ECR\`"
            echo "- 태그: \`$TAG\`, \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ECR push 만으로는 running 인스턴스에 반영 안 됨 → ASG 롤링 교체로 새 :latest 배포.
      # 새 인스턴스가 부팅하며 user_data 로 :latest 를 pull, ELB 헬스체크 통과 시 순차 교체(무중단).
      - name: Rolling deploy (ASG instance refresh)
        env:
          ASG_NAME: ${{ vars.ASG_NAME || 'chilsami-asg' }}
        run: |
          set -euo pipefail
          status() {
            aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --max-records 1 --query 'InstanceRefreshes[0].Status' --output text 2>/dev/null || echo None
          }
          # 이미 진행 중인 refresh 가 있으면 start 는 InstanceRefreshInProgressFault 로 실패.
          # 최신 이미지가 이겨야 하므로 진행 중이면 취소하고 종료될 때까지 대기 후 새로 시작.
          if [[ "$(status)" == "Pending" || "$(status)" == "InProgress" ]]; then
            echo "진행 중 refresh 취소 후 재시작"
            aws autoscaling cancel-instance-refresh --auto-scaling-group-name "$ASG_NAME" || true
            for _ in $(seq 1 30); do
              case "$(status)" in Pending|InProgress|Cancelling) sleep 10 ;; *) break ;; esac
            done
          fi
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":180}' \
            --query InstanceRefreshId --output text)
          echo "instance refresh 시작: $REFRESH_ID"

          # 완료까지 대기 — 시작만 하고 끝내면 교체 실패(unhealthy 롤백)가 초록불 뒤에 숨는다.
          # (v0.2.0 배포 때 Flyway 체크섬 불일치로 기동 실패했는데 CD 는 성공으로 남았던 사건 재발 방지)
          RESULT=Timeout
          STATE="" PCT="" REASON=""
          for _ in $(seq 1 60); do   # 30초 × 60 = 최대 30분
            # 조회 실패(자격증명·권한·네트워크)를 삼키면 빈 상태로 30분 폴링하다 Timeout 으로 끝나 원인이 가려진다.
            # 명령을 먼저 변수에 담아 실패를 즉시 전파한다.
            if ! SNAPSHOT=$(aws autoscaling describe-instance-refreshes \
                  --auto-scaling-group-name "$ASG_NAME" --instance-refresh-ids "$REFRESH_ID" \
                  --query 'InstanceRefreshes[0].[Status,PercentageComplete,StatusReason]' --output text); then
              echo "::error::describe-instance-refreshes 호출 실패 — 자격증명/권한/네트워크를 확인하세요."
              RESULT=QueryFailed
              break
            fi
            read -r STATE PCT REASON <<< "$SNAPSHOT"
            echo "refresh: $STATE (${PCT}%) $REASON"
            case "$STATE" in
              Successful) RESULT=Successful; break ;;
              Failed|Cancelled|RollbackSuccessful|RollbackFailed) RESULT="$STATE"; break ;;
            esac
            sleep 30
          done
          # 요약은 루프가 마지막으로 관측한 스냅샷을 그대로 쓴다(재조회 시 값이 어긋날 수 있음).
          {
            echo "## 롤링 배포 (ASG Instance Refresh) 🚀"
            echo ""
            echo "- ASG: \`$ASG_NAME\`"
            echo "- refresh id: \`$REFRESH_ID\`"
            echo "- 결과: **$RESULT** (${PCT:-?}%) ${REASON}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$RESULT" != "Successful" ]]; then
            echo "::error::instance refresh $RESULT — 새 인스턴스가 헬스체크를 통과하지 못했거나 시간 초과. 인스턴스 로그(docker logs app)를 확인하세요."
            exit 1
          fi
