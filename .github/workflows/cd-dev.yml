name: Backend CD (dev)

# develop push 시 이미지 빌드 → ECR(dev-*) push → dev 인스턴스에 SSM 재배포.
# dev 서버는 ASG 없는 단일 private 인스턴스라 instance refresh 대신 SSM RunShellScript 로 재배포한다.
on:
  push:
    branches: [develop]

permissions:
  id-token: write # OIDC (AWS_DEPLOY_ROLE_ARN_DEV assume)
  contents: read

concurrency:
  group: backend-cd-dev
  cancel-in-progress: false

jobs:
  build-deploy-dev:
    name: build & deploy (dev)
    runs-on: ubuntu-latest
    if: vars.AWS_DEPLOY_ROLE_ARN_DEV != '' # dev 배포 변수 등록 시 활성화
    steps:
      # 공급망 보안: 배포 자격증명을 다루므로 액션을 커밋 SHA로 고정 (주석은 버전)
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_DEV }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build & push image (dev tags)
        env:
          ECR: ${{ vars.ECR_REPOSITORY }}
        run: |
          TAG="dev-${GITHUB_SHA::7}"
          docker build -t "$ECR:$TAG" -t "$ECR:dev-latest" .
          docker push "$ECR:$TAG"
          docker push "$ECR:dev-latest"
          {
            echo "## Backend CD (dev) — 이미지 push ✅"
            echo ""
            echo "- 레포: \`$ECR\`"
            echo "- 태그: \`$TAG\`, \`dev-latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # 단일 인스턴스라 SSM RunShellScript 로 재배포 스크립트(/usr/local/bin/dev-redeploy.sh)를 재실행.
      # 스크립트가 dev-latest 를 pull 하고 컨테이너를 재기동한다. Name 태그로 타깃(인스턴스 ID 불필요).
      - name: Redeploy dev instance (SSM)
        env:
          DEV_NAME_TAG: ${{ vars.DEV_INSTANCE_NAME_TAG || 'chilsami-dev-app' }}
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=tag:Name,Values=$DEV_NAME_TAG" \
            --comment "dev redeploy ${GITHUB_SHA::7}" \
            --parameters commands='/usr/local/bin/dev-redeploy.sh' \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          # 완료까지 대기 — 시작만 하고 끝내면 배포 실패가 초록불 뒤에 숨는다.
          RESULT=Timeout
          STATUS="" DETAIL=""
          for _ in $(seq 1 40); do   # 15초 × 40 = 최대 10분
            if ! SNAP=$(aws ssm list-command-invocations --command-id "$CMD_ID" --details \
                  --query 'CommandInvocations[0].[Status,StatusDetails]' --output text 2>/dev/null); then
              sleep 15; continue   # 인보케이션이 아직 안 잡힐 수 있음
            fi
            read -r STATUS DETAIL <<< "$SNAP"
            echo "redeploy: $STATUS $DETAIL"
            case "$STATUS" in
              Success) RESULT=Success; break ;;
              Failed|Cancelled|TimedOut) RESULT="$STATUS"; break ;;
            esac
            sleep 15
          done
          {
            echo "## dev 재배포 (SSM) 🚀"
            echo ""
            echo "- 대상: \`Name=$DEV_NAME_TAG\`"
            echo "- command: \`$CMD_ID\`"
            echo "- 결과: **$RESULT** ${DETAIL}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$RESULT" != "Success" ]]; then
            echo "::error::dev 재배포 $RESULT — dev 인스턴스에서 'docker logs app' 및 SSM command 출력을 확인하세요."
            exit 1
          fi
