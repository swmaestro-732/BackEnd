# 로컬 개발용 Postgres·MongoDB(채팅 메시지). `docker compose up -d` 후 앱/테스트 실행.
# 운영/CI 는 환경변수(SPRING_DATASOURCE_*)로 별도 DB 를 주입한다.
services:
  postgres:
    image: postgis/postgis:16-3.5
    platform: linux/amd64 # postgis 공식 이미지는 arm64 미제공 — Apple Silicon 은 Rosetta 로 실행
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chilsami
      POSTGRES_USER: chilsami
      POSTGRES_PASSWORD: localdev
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:8.0
    # 트랜잭션(seq 발급 + 저장)은 레플리카셋에서만 동작한다. 서버 1대짜리 레플리카셋으로 띄운다.
    command: [ "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "27017:27017"
    environment:
      # bootRun 시 spring-boot-docker-compose 가 이 값으로 DB 이름을 정한다(없으면 test).
      MONGO_INITDB_DATABASE: chilsami
    # 처음 한 번 레플리카셋을 초기화한다. 앱이 호스트에서 붙으므로 멤버 주소는 localhost 로 둔다.
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }" ]
      interval: 5s
      timeout: 10s
      retries: 10
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:
